<app-header></app-header>

<main>
  <app-hero></app-hero>

  <section id="prices" class="py-12 bg-gray-50">
    <div class="container mx-auto px-4">
      <h2 class="text-3xl font-bold text-center mb-2">أسعار الذهب اليوم</h2>
      <p class="text-center text-gray-500 mb-8">جميع الأسعار بالريال العُماني للجرام الواحد</p>

      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
        <app-price-card
          *ngFor="let item of todayPrices"
          [karat]="item.karat"
          [price]="item.price"
          [unit]="item.unit">
        </app-price-card>
      </div>
    </div>
  </section>

  <app-calculator></app-calculator>
  <app-trend-chart></app-trend-chart>
  <app-history-table></app-history-table>
</main>

<app-footer></app-footer>
