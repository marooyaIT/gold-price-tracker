<section id="trend" class="py-12 bg-gray-50">
  <div class="container mx-auto px-4">
    <h2 class="text-3xl font-bold text-center mb-2">تغير الأسعار آخر 30 يوم</h2>
    <p class="text-center text-gray-500 mb-8">اختر العيار لعرض الرسم البياني</p>

    <div class="flex justify-center gap-2 mb-8 flex-wrap">
      <button *ngFor="let k of karats" 
              (click)="selectKarat(k)"
              [class.bg-yellow-600]="selectedKarat === k"
              [class.text-white]="selectedKarat === k"
              [class.bg-white]="selectedKarat !== k"
              class="px-4 py-2 rounded-full border border-yellow-600 text-yellow-600 font-medium transition">
        {{ k }}
      </button>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
      <div class="bg-white p-4 rounded-lg shadow text-center">
        <p class="text-gray-500">السعر الحالي</p>
        <p class="text-2xl font-bold text-yellow-600">{{ currentPrice }}</p>
      </div>
      <div class="bg-white p-4 rounded-lg shadow text-center">
        <p class="text-gray-500">أعلى سعر</p>
        <p class="text-2xl font-bold text-green-600">{{ highestPrice }}</p>
      </div>
      <div class="bg-white p-4 rounded-lg shadow text-center">
        <p class="text-gray-500">أقل سعر</p>
        <p class="text-2xl font-bold text-red-600">{{ lowestPrice }}</p>
      </div>
    </div>

    <div class="bg-white p-4 rounded-lg shadow overflow-x-auto">
      <svg viewBox="0 0 600 200" class="w-full h-48">
        <polyline [attr.points]="svgPoints" fill="none" stroke="#d97706" stroke-width="2" />
      </svg>
    </div>

    <div class="mt-4 flex justify-center gap-6 text-sm">
      <span>السعر الحالي: <strong>{{ currentPrice }}</strong></span>
      <span>السعر السابق: <strong>{{ previousPrice }}</strong></span>
      <span>التغير: 
        <strong [class.text-green-600]="change >= 0" [class.text-red-600]="change < 0">
          {{ change >= 0 ? '+' : '' }}{{ change }}
        </strong>
      </span>
    </div>
  </div>
</section>
