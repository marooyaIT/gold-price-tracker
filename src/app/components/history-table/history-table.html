<section class="py-12 bg-white">
  <div class="container mx-auto px-4">
    <h2 class="text-3xl font-bold text-center mb-8">سجل الأسعار آخر 30 يوم</h2>

    <div class="overflow-x-auto shadow rounded-lg">
      <table class="min-w-full bg-white">
        <thead class="bg-yellow-600 text-white">
          <tr>
            <th class="py-3 px-4 text-right">التاريخ</th>
            <th class="py-3 px-4 text-right">18K</th>
            <th class="py-3 px-4 text-right">21K</th>
            <th class="py-3 px-4 text-right">22K</th>
            <th class="py-3 px-4 text-right">24K</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let row of history; let i = index"
              [class.bg-gray-50]="i % 2 === 0">
            <td class="py-2 px-4 border-b">{{ row.date }}</td>
            <td class="py-2 px-4 border-b">{{ row.k18 }}</td>
            <td class="py-2 px-4 border-b">{{ row.k21 }}</td>
            <td class="py-2 px-4 border-b">{{ row.k22 }}</td>
            <td class="py-2 px-4 border-b">{{ row.k24 }}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</section>
